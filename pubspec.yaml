name: trident
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'
dependencies:
  flutter:
    sdk: flutter


# Utility Packages
  intl: ^0.19.0
  dynamic_path_url_strategy: ^1.0.0
  lottie:
  google_fonts:
  dropdown_button2: ^2.3.9
  animated_custom_dropdown: ^3.1.1
  flutter_screenutil:
  shimmer: ^3.0.0
  clipboard: ^0.1.3
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  flutter_dropzone: ^4.2.1
  flutter_typeahead: ^5.2.0
  connectivity_plus: ^6.1.4
  multi_select_flutter: ^4.1.3
  cached_network_image: ^3.4.1
  flutter_native_splash: ^2.4.0
  smooth_page_indicator: ^1.2.1
  shared_preferences: ^2.5.3
  custom_refresh_indicator: ^4.0.1

  # Web Specific
  web: ^1.0.0
  http: ^1.3.0
  html: ^0.15.4
  fl_chart: ^0.71.0
  data_table_2:
  flutter_svg:
  url_strategy: ^0.2.0
  syncfusion_flutter_charts: ^29.2.5
  flutter_otp_text_field: ^1.5.1+1
  universal_html: ^2.2.4
  persistent_bottom_nav_bar: ^6.2.1

  # Icons
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.8

  # State Management
  get: ^4.6.6
  get_storage: ^2.1.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  firebase_storage: ^12.4.5
  firebase_auth_platform_interface: ^7.7.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/logos/app_logo.png" # Path to your icon image

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/logos/
    - assets/icons/
    - assets/images/content/


